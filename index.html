<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ffe600"
  >

  <meta
    name="description"
    content="El Patrón de las Ofertas - Cupones y ofertas de Mercado Libre México"
  >

  <title>⚡ El Patrón de las Ofertas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .header {
      background: #ffe600;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
    }

    .admin-link {
      background: #111;
      color: white;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
    }

    .hero {
      max-width: 1200px;
      margin: 25px auto;
      padding: 35px 20px;
      background: linear-gradient(135deg,#fff,#fff8b0);
      border-radius: 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(30px, 6vw, 55px);
      font-weight: 900;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 17px;
      color: #555;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 0 15px 50px;
    }

    .section-title {
      margin: 30px 0 15px;
      font-size: 25px;
      font-weight: 900;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .coupon-code {
      display: inline-block;
      margin: 10px 0;
      padding: 9px 12px;
      background: #f1f1f1;
      border-radius: 8px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      background: #ffe600;
      color: #111;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .empty {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      color: #777;
    }

    .whatsapp {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #25d366;
      color: white;
      text-decoration: none;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,.25);
      z-index: 999;
    }

    @media(max-width:600px) {
      .header-inner {
        flex-direction: column;
      }

      .hero {
        margin: 15px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="logo">
      ⚡ EL PATRÓN DE LAS OFERTAS
    </div>

    <a
      href="./admin.html"
      class="admin-link"
    >
      🔐 ADMIN
    </a>

  </div>
</header>


<section class="hero">

  <h1>
    ⚡ EL PATRÓN DE LAS OFERTAS
  </h1>

  <p>
    Cupones, descuentos y las mejores ofertas de Mercado Libre México.
  </p>

</section>


<main class="container">

  <h2 class="section-title">
    🎟️ Cupones disponibles
  </h2>

  <div
    id="coupons"
    class="cards"
  >

    <div class="empty">
      Cargando cupones...
    </div>

  </div>


  <h2 class="section-title">
    🔥 Últimas ofertas
  </h2>

  <div
    id="offers"
    class="cards"
  >

    <div class="empty">
      Cargando ofertas...
    </div>

  </div>

</main>


<a
  class="whatsapp"
  href="https://whatsapp.com/channel/0029Vb7W8ijKrWQpUEGkJe1x"
  target="_blank"
  rel="noopener"
>
  💬
</a>


<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const $ = selector =>
  document.querySelector(selector);


function precio(valor) {

  return new Intl.NumberFormat(
    "es-MX",
    {
      style: "currency",
      currency: "MXN"
    }
  ).format(
    Number(valor || 0)
  );

}


function escapar(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


async function cargarPagina() {

  try {

    const [
      couponsSnapshot,
      offersSnapshot
    ] = await Promise.all([

      getDocs(
        collection(
          db,
          "cupones"
        )
      ),

      getDocs(
        collection(
          db,
          "ofertas"
        )
      )

    ]);


    const coupons =
      couponsSnapshot.docs.map(
        item => ({
          id: item.id,
          ...item.data()
        })
      );


    const offers =
      offersSnapshot.docs.map(
        item => ({
          id: item.id,
          ...item.data()
        })
      );


    renderCupones(coupons);
    renderOfertas(offers);


  } catch(error) {

    console.error(error);

    $("#coupons").innerHTML = `
      <div class="empty">
        ❌ No se pudieron cargar los cupones.
      </div>
    `;

    $("#offers").innerHTML = `
      <div class="empty">
        ❌ No se pudieron cargar las ofertas.
      </div>
    `;

  }

}


function renderCupones(coupons) {

  const container =
    $("#coupons");

  const activos =
    coupons.filter(
      coupon =>
        coupon.activo !== false
    );


  if (!activos.length) {

    container.innerHTML = `
      <div class="empty">
        No hay cupones disponibles.
      </div>
    `;

    return;

  }


  container.innerHTML = "";


  activos.forEach(
    coupon => {

      const codigo =
        String(
          coupon.codigo ||
          coupon.code ||
          ""
        ).toUpperCase();


      const card =
        document.createElement("article");

      card.className = "card";


      card.innerHTML = `

        <h3>
          🎟️ ${escapar(codigo)}
        </h3>

        <p>
          ${escapar(
            coupon.descuento ||
            coupon.monto ||
            coupon.valor ||
            ""
          )}
        </p>

        <div class="coupon-code">
          ${escapar(codigo)}
        </div>

        <button class="button">
          🚀 APLICAR CUPÓN
        </button>

      `;


      card
        .querySelector("button")
        .addEventListener(
          "click",
          () => {

            if (
              coupon.link
            ) {

              window.location.href =
                coupon.link;

            }

          }
        );


      container.appendChild(card);

    }
  );

}


function renderOfertas(offers) {

  const container =
    $("#offers");


  if (!offers.length) {

    container.innerHTML = `
      <div class="empty">
        No hay ofertas publicadas.
      </div>
    `;

    return;

  }


  container.innerHTML = "";


  offers.forEach(
    offer => {

      const card =
        document.createElement("article");

      card.className =
        "card";


      card.innerHTML = `

        ${
          offer.imagen
            ? `
              <img
                src="${escapar(offer.imagen)}"
                alt=""
                style="
                  width:100%;
                  height:180px;
                  object-fit:contain;
                  margin-bottom:15px;
                "
              >
            `
            : ""
        }

        <h3>
          ${escapar(
            offer.titulo ||
            "Oferta"
          )}
        </h3>

        <p>
          Antes:
          <s>
            ${precio(
              offer.precioAntes
            )}
          </s>
        </p>

        <p>
          <strong>
            ${precio(
              offer.precioActual ||
              offer.precioFinal
            )}
          </strong>
        </p>

        ${
          offer.link
            ? `
              <a
                class="button"
                href="${escapar(offer.link)}"
                target="_blank"
                rel="noopener"
              >
                🔥 VER OFERTA
              </a>
            `
            : ""
        }

      `;


      container.appendChild(card);

    }
  );

}


cargarPagina();

</script>

</body>
</html>
